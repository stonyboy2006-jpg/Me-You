<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Access Restricted — This page is reserved for the wedding owner.">
<meta property="og:title" content="Access Restricted">
<meta property="og:description" content="This page is reserved for the wedding owner.">
<meta property="og:image" content="https://foreverandalwayswedding.com/icons/icon-512.svg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Access Restricted">
<meta name="twitter:description" content="This page is reserved for the wedding owner.">
<link rel="canonical" href="https://foreverandalwayswedding.com/403.html">
<title>Access Restricted — Forever &amp; Always</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0B0F19;color:#E8E0D0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.12;pointer-events:none}
.bg-orb.gold{width:400px;height:400px;background:#D4AF37;top:-100px;right:-100px}
.bg-orb.rose{width:300px;height:300px;background:#E8C4C0;bottom:-80px;left:-80px}
.container{text-align:center;padding:2rem;position:relative;z-index:1;max-width:520px}
.icon{font-size:3.5rem;margin-bottom:1rem;opacity:0.9}
.code{font-family:'Playfair Display',serif;font-size:clamp(4rem,12vw,8rem);font-weight:700;background:linear-gradient(135deg,#D4AF37,#F7E7CE,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:0.3rem}
h2{font-family:'Playfair Display',serif;font-size:1.5rem;color:#fff;margin-bottom:0.5rem}
p{font-size:0.95rem;color:#A09888;line-height:1.7;margin-bottom:1.5rem;max-width:420px;margin-left:auto;margin-right:auto}
.links{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:0.8rem 1.8rem;border:1px solid rgba(212,175,55,0.25);background:rgba(212,175,55,0.06);color:#D4AF37;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:500;border-radius:50px;text-decoration:none;transition:all 0.3s ease;cursor:pointer}
.btn:hover{background:rgba(212,175,55,0.14);border-color:rgba(212,175,55,0.45);transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,0.12)}
.btn-primary{background:linear-gradient(135deg,#D4AF37,#B8962E);color:#0B0F19;border:none;font-weight:600}
.btn-primary:hover{box-shadow:0 8px 28px rgba(212,175,55,0.3)}
.notice{color:rgba(255,255,255,0.2);font-size:0.75rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(212,175,55,0.06)}
</style>
</head>
<body>
<div class="bg-orb gold"></div>
<div class="bg-orb rose"></div>
<div class="container">
  <div class="icon">&#128274;</div>
  <div class="code">403</div>
  <h2>Access Restricted</h2>
  <p id="errorMessage">This page is reserved for the wedding owner. If you are looking for a wedding invitation, please use the invitation link you received from the couple.</p>
  <div class="links" id="actionButtons">
    <a href="login.html" class="btn btn-primary"><i class="fas fa-lock-open"></i> Owner Login</a>
  </div>
  <div class="notice"><i class="fas fa-ring"></i> Forever &amp; Always &mdash; Luxury Wedding Platform</div>
</div>
<script>
(function(){
  var session = null;
  try {
    var s = JSON.parse(localStorage.getItem('weddingAuthSession'));
    if (s && s.expiresAt && Date.now() < s.expiresAt) session = s;
  } catch(e) {}
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref') || '';
  if (ref.indexOf('/invite/') !== -1) {
    document.getElementById('errorMessage').textContent = 'This page is reserved for the wedding owner. Please use your invitation link to view the wedding details.';
    document.getElementById('actionButtons').innerHTML = '<a href="' + ref + '" class="btn btn-primary"><i class="fas fa-envelope"></i> View Invitation</a>';
  } else if (session) {
    document.getElementById('actionButtons').innerHTML =
      '<a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Go to Dashboard</a>' +
      '<a href="#" class="btn" onclick="localStorage.removeItem(\'weddingAuthSession\');window.location.href=\'login.html\';return false"><i class="fas fa-sign-out-alt"></i> Logout</a>';
  }
})();
</script>
</body>
</html>
