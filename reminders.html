<div id="sidebarOverlay" class="sidebar-overlay"></div>
<aside id="dashboardSidebar" class="sidebar" role="navigation" aria-label="Owner navigation">
<div class="sidebar-header">
<div class="sidebar-brand"><a href="index.html"><img src="icons/icon-192.svg" alt="Forever &amp; Always" style="height:32px"></a></div>
<button id="closeSidebarBtn" class="close-sidebar-btn" aria-label="Close sidebar"><i class="fas fa-times"></i></button>
</div>
<nav class="sidebar-nav" role="menubar">
<a href="dashboard.html" class="sidebar-link" role="menuitem"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>

</div>

<main id="mainContent" class="main-content" role="main">
<header class="main-header" role="banner">
<button id="menuToggle" class="menu-toggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
<div class="header-title"><h1>Wedding Reminders</h1><p class="header-subtitle">Stay on track with your wedding timeline</p></div>
<div class="header-actions">
<button onclick="WeddingReminders.generateFromTemplate()" class="header-btn" title="Generate from template" aria-label="Generate reminders from template"><i class="fas fa-magic"></i></button>
</div>
</header>
<div style="padding:20px">
<div id="reminderPanel" style="max-width:800px;margin:0 auto"></div>
</div>
</main>
<div id="notificationContainer" style="position:fixed;top:20px;right:20px;z-index:10000;pointer-events:none"></div>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/error-logger.js"></script>
<script src="js/audit-log.js"></script>
<script src="js/notifications.js"></script>
<script src="js/auth.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/reminders.js"></script>
<script src="js/global.js"></script>
<script>
(function(){
  var toggle=document.getElementById('menuToggle');
  var sidebar=document.getElementById('dashboardSidebar');
  var overlay=document.getElementById('sidebarOverlay');
  var closeBtn=document.getElementById('closeSidebarBtn');
  if(toggle)toggle.addEventListener('click',function(){sidebar.classList.add('open');overlay.classList.add('visible');});
  if(closeBtn)closeBtn.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('visible');});
  if(overlay)overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('visible');});
  if(typeof WeddingReminders!=='undefined')WeddingReminders.renderRemindersPanel('reminderPanel');
})();
</script>
</body>
