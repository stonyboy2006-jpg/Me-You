<style>
.story-page{padding:100px 20px 60px;min-height:100vh;background:var(--cream);}
.story-page .story-timeline{max-width:700px;margin:0 auto;position:relative;}
.story-page .story-timeline::before{content:'';position:absolute;top:0;left:50%;width:2px;height:100%;background:linear-gradient(to bottom,var(--gold),var(--gold-light),var(--gold));transform:translateX(-50%);}
.story-page .story-item{display:flex;align-items:flex-start;margin-bottom:50px;position:relative;}
.story-page .story-item .story-date{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:6px 18px;border-radius:50px;font-family:'Inter',sans-serif;font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;z-index:2;white-space:nowrap;}
.story-page .story-item .story-content{width:45%;padding:30px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:40px;}
.story-page .story-item:nth-child(odd) .story-content{margin-right:auto;}
.story-page .story-item:nth-child(even) .story-content{margin-left:auto;}
.story-page .story-content h3{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.3rem;margin-bottom:8px;}
.story-page .story-content p{color:var(--text-light);line-height:1.8;}
.story-page .story-img-placeholder{width:100%;height:200px;background:linear-gradient(135deg,var(--blush),var(--gold-light));border-radius:8px;margin-bottom:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;}
/* Back button styling is in style.css */
@media(max-width:768px){
  .story-page .story-timeline::before{left:20px;}
  .story-page .story-item,.story-page .story-item:nth-child(even){flex-direction:row;padding-left:50px;}
  .story-page .story-item .story-date{left:20px;transform:translateX(0);}
  .story-page .story-item .story-content{width:100%;margin:40px 0 0 0!important;padding:20px;}
}
</style>
