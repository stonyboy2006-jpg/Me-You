<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Log in to your Forever & Always wedding account">
<meta name="theme-color" content="#0B0F19">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.googleapis.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src 'self' https://www.google.com https://maps.google.com; media-src 'self' blob:;">
<meta property="og:title" content="Login - Wedding Dashboard">
<meta property="og:description" content="Log in to your Forever &amp; Always wedding account">
<meta property="og:image" content="https://foreverandalwayswedding.com/icons/icon-512.svg">
<meta property="og:url" content="https://foreverandalwayswedding.com/login.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Login - Wedding Dashboard">
<meta name="twitter:description" content="Log in to your Forever &amp; Always wedding account">
<link rel="canonical" href="https://foreverandalwayswedding.com/login.html">
<title>Log In - Forever &amp; Always</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<style>:root{--gold:#D4AF37;--dark:#0B0F19;--dark-soft:#111827;--text:#E8E0D0;--text-light:#A09888;--white:#fff;--font-heading:'Playfair Display',serif;--font-body:'Poppins',sans-serif;--font-sans:'Poppins',sans-serif;--font-script:'Great Vibes',cursive;--radius:16px;--radius-sm:8px;--radius-lg:24px;--transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);--success:#22c55e;--error:#ef4444;--warning:#f59e0b;--info:#3b82f6;--gold-light:#e8c968;--gold-dark:#b8941f}</style>
</head>
<body class="auth-page">

<!-- Particles -->
<div class="auth-particles" id="authParticles"></div>

<div class="auth-container">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html"><i class="fas fa-ring"></i> Forever & Always</a>
      <div class="auth-subtitle">Welcome Back</div>
    </div>

    <!-- Title -->
    <h1 class="auth-title">Log <span class="gold">In</span></h1>
    <p class="auth-desc">Access your wedding planning dashboard</p>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
      <!-- Email -->
      <div class="auth-form-group">
        <label>Email Address <span class="required">*</span></label>
        <div class="auth-input-wrapper">
          <input type="email" id="loginEmail" class="auth-input" placeholder="Enter your email" autocomplete="email" required>
          <i class="fas fa-envelope"></i>
        </div>
        <div class="auth-error" id="emailError"></div>
      </div>

      <!-- Password -->
      <div class="auth-form-group">
        <label>Password <span class="required">*</span></label>
        <div class="auth-input-wrapper">
          <input type="password" id="loginPassword" class="auth-input" placeholder="Enter your password" autocomplete="current-password" required>
          <i class="fas fa-lock"></i>
        </div>
        <div class="auth-error" id="passwordError"></div>
      </div>

      <!-- Remember Me / Forgot -->
      <div class="auth-row">
        <label class="auth-checkbox">
          <input type="checkbox" id="rememberMe" checked> Remember me
        </label>
        <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="auth-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Log In
      </button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>

    <!-- Back -->
    <div style="text-align:center;margin-top:20px">
      <a href="index.html" style="font-size:0.82rem;color:var(--text-light);text-decoration:none;display:inline-flex;align-items:center;gap:6px"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
(function(){
  /* If already logged in, redirect */
  if(isLoggedIn()){
    const redirect=getRedirectUrl();
    window.location.href=redirect;
    return;
  }

  /* Particles */
  const pc=document.getElementById('authParticles');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');p.className='auth-particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=Math.random()*6+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    pc.appendChild(p);
  }

  /* Focus first field */
  setTimeout(function(){document.getElementById('loginEmail').focus();},300);
})();

function showError(id,msg){
  const el=document.getElementById(id);if(!el)return;
  el.textContent=msg;el.classList.add('show');
  const input=el.closest('.auth-form-group').querySelector('.auth-input');
  if(input)input.classList.add('error');
}
function clearErrors(){
  document.querySelectorAll('.auth-error').forEach(e=>{e.classList.remove('show');e.textContent='';});
  document.querySelectorAll('.auth-input').forEach(i=>i.classList.remove('error'));
}

async function handleLogin(e){
  e.preventDefault();
  clearErrors();

  const email=document.getElementById('loginEmail').value;
  const pw=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');

  let valid=true;
  if(!email.trim()){showError('emailError','Email address is required');valid=false;}
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())){showError('emailError','Please enter a valid email address');valid=false;}
  if(!pw){showError('passwordError','Password is required');valid=false;}

  if(!valid)return;

  btn.disabled=true;
  btn.innerHTML='<div class="spinner"></div> Logging In...';

  try{
    const result=await logIn(email,pw);
    if(result.ok){
      showAuthNotification('Login successful! Redirecting...','success');
      setTimeout(function(){
        const redirect=getRedirectUrl();
        window.location.href=redirect;
      },1000);
    }else{
      showAuthNotification(result.error,'error');
      btn.disabled=false;
      btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Log In';
    }
  }catch(err){
    showAuthNotification('Something went wrong. Please try again.','error');
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Log In';
  }
}
</script>
</body>
</html>
