<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#0B0F19">

<meta property="og:title" content="Reset Password">

<title>Forgot Password - Forever &amp; Always</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<style>:root{--gold:#D4AF37;--dark:#0B0F19;--dark-soft:#111827;--text:#E8E0D0;--text-light:#A09888;--white:#fff;--font-heading:'Playfair Display',serif;--font-body:'Poppins',sans-serif;--font-sans:'Poppins',sans-serif;--font-script:'Great Vibes',cursive;--radius:16px;--radius-sm:8px;--radius-lg:24px;--transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);--success:#22c55e;--error:#ef4444;--warning:#f59e0b;--info:#3b82f6;--gold-light:#e8c968;--gold-dark:#b8941f}</style>
</head>
<body class="auth-page">

<div class="auth-particles" id="authParticles"></div>

<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="index.html"><i class="fas fa-ring"></i> Forever & Always</a>
    </div>

    <h1 class="auth-title">Forgot <span class="gold">Password</span></h1>
    <p class="auth-desc">Enter your email and we'll send you a reset link</p>

    <form id="resetForm" onsubmit="handleReset(event)" novalidate>
      <div class="auth-form-group">
        <label>Email Address <span class="required">*</span></label>
        <div class="auth-input-wrapper">
          <input type="email" id="resetEmail" class="auth-input" placeholder="Enter your email" autocomplete="email" required>
          <i class="fas fa-envelope"></i>
        </div>
        <div class="auth-error" id="resetEmailError"></div>
      </div>

      <button type="submit" class="auth-btn" id="resetBtn">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="login.html">Log In</a>
    </div>

    <div style="text-align:center;margin-top:20px">
      <a href="index.html" style="font-size:0.82rem;color:var(--text-light);text-decoration:none;display:inline-flex;align-items:center;gap:6px"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

  </div>
</div>

<script src="js/auth.js"></script>
<script>
(function(){
  if(isLoggedIn()){window.location.href='setup.html';return;}
  const pc=document.getElementById('authParticles');
  for(let i=0;i<20;i++){
    const p=document.createElement('div');p.className='auth-particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=Math.random()*6+'s';
    p.style.animationDuration=(4+Math.random()*4)+'s';
    pc.appendChild(p);
  }
  setTimeout(function(){document.getElementById('resetEmail').focus();},300);
})();

async function handleReset(e){
  e.preventDefault();
  const email=document.getElementById('resetEmail').value;
  const errEl=document.getElementById('resetEmailError');
  const btn=document.getElementById('resetBtn');

  errEl.classList.remove('show');
  document.querySelector('.auth-input').classList.remove('error');

  if(!email.trim()){
    errEl.textContent='Email address is required';errEl.classList.add('show');
    document.getElementById('resetEmail').classList.add('error');
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())){
    errEl.textContent='Please enter a valid email address';errEl.classList.add('show');
    document.getElementById('resetEmail').classList.add('error');
    return;
  }

  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Sending...';

  setTimeout(function(){
    btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Link Sent!';
    showAuthNotification('If an account exists with this email, a reset link has been sent.','success');
    setTimeout(function(){
      btn.innerHTML='<i class="fas fa-paper-plane"></i> Send Reset Link';
    },3000);
  },1500);
}
</script>
</body>
</html>
