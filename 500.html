<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
<meta name="description" content="Something went wrong on our end. Please try again later or contact support for help.">
<meta property="og:title" content="Server Error">
<meta property="og:description" content="Something went wrong on our end. Please try again later or contact support for help.">
<meta property="og:image" content="https://foreverandalwayswedding.com/icons/icon-512.svg">
<meta property="og:url" content="https://foreverandalwayswedding.com/500.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Server Error">
<meta name="twitter:description" content="Something went wrong on our end. Please try again later or contact support for help.">
<link rel="canonical" href="https://foreverandalwayswedding.com/500.html">
<title>500 Server Error - Forever &amp; Always</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0F19;color:#E8E0D0;font-family:'Poppins',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.container{max-width:500px}
.code{font-family:'Playfair Display',serif;font-size:clamp(5rem,15vw,10rem);background:linear-gradient(135deg,#D4AF37,#B8860B,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#fff;margin:12px 0 8px}
p{color:#A09888;font-size:0.95rem;line-height:1.7;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,#D4AF37,#B8860B);color:#0B0F19;border-radius:50px;font-weight:600;text-decoration:none;font-size:0.85rem;transition:all 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,175,55,0.3)}
.icon{font-size:3rem;margin-bottom:12px}
.retry-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.2);color:#D4AF37;border-radius:50px;font-weight:500;text-decoration:none;font-size:0.85rem;margin-left:12px;transition:all 0.3s}
.retry-btn:hover{background:rgba(212,175,55,0.1);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#9888;</div>
  <div class="code">500</div>
  <h2>Internal Server Error</h2>
  <p>Something went wrong on our end. Please try again later. If the problem persists, contact support.</p>
  <div>
    <a href="index.html" class="btn">&#8592; Back to Home</a>
    <a href="javascript:location.reload()" class="retry-btn">&#8635; Retry</a>
  </div>
</div>
</body>
</html>
