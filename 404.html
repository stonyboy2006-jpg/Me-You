<!DOCTYPE html>
<html lang="en">
<head>

<title>Not Found — Forever &amp; Always</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0B0F19;color:#E8E0D0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.15;pointer-events:none}
.bg-orb.gold{width:400px;height:400px;background:#D4AF37;top:-100px;right:-100px}
.bg-orb.rose{width:300px;height:300px;background:#E8C4C0;bottom:-80px;left:-80px}
.container{text-align:center;padding:2rem;position:relative;z-index:1;max-width:520px}
.ring{font-size:4rem;margin-bottom:1rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.7}}
h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,6rem);font-weight:700;background:linear-gradient(135deg,#D4AF37,#F7E7CE,#D4AF37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:0.5rem}
p{font-size:1rem;color:#A09888;line-height:1.7;margin-bottom:1.5rem;max-width:420px;margin-left:auto;margin-right:auto}
.links{display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:0.8rem 1.8rem;border:1px solid rgba(212,175,55,0.25);background:rgba(212,175,55,0.06);color:#D4AF37;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:500;border-radius:50px;text-decoration:none;transition:all 0.3s ease;cursor:pointer}
.btn:hover{background:rgba(212,175,55,0.14);border-color:rgba(212,175,55,0.45);transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,0.12)}
.btn-primary{background:linear-gradient(135deg,#D4AF37,#B8962E);color:#0B0F19;border:none;font-weight:600}
.btn-primary:hover{box-shadow:0 8px 28px rgba(212,175,55,0.3)}
.btn-secondary{background:transparent;border:1px solid rgba(212,175,55,0.25);color:#D4AF37}
.notice{color:rgba(255,255,255,0.2);font-size:0.75rem;margin-top:2rem;padding-top:1.5rem;border-top:1px solid rgba(212,175,55,0.06)}
#inviteHelp{display:none;margin-top:1rem;padding:1rem;background:rgba(212,175,55,0.04);border:1px solid rgba(212,175,55,0.08);border-radius:12px;font-size:0.82rem;color:rgba(255,255,255,0.5)}
</style>
</head>
<body>
<div class="bg-orb gold"></div>
<div class="bg-orb rose"></div>
<div class="container">
  <div class="ring">&#128140;</div>
  <h1>404</h1>
  <p id="errorMessage">This invitation could not be found. It may have been removed or the link may be incorrect.</p>
  <div class="links" id="actionButtons">
    <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Home</a>
    <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Go Back</a>
  </div>
  <div id="inviteHelp"></div>
  <div class="notice"><i class="fas fa-ring"></i> Forever &amp; Always &mdash; Luxury Wedding Platform</div>
</div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref') || '';
  if (ref.indexOf('/invite/') !== -1) {
    document.getElementById('errorMessage').textContent = 'This invitation could not be found. It may have been removed or the link may be incorrect.';
    document.getElementById('inviteHelp').innerHTML = '<p><i class="fas fa-info-circle"></i> If you received this link from the couple, please ask them to verify their wedding is published and active.</p>';
    document.getElementById('inviteHelp').style.display = 'block';
  }
  if (window.location.pathname.indexOf('/invite/') === 0) {
    document.getElementById('errorMessage').textContent = 'This invitation could not be found. It may have been removed or the link may be incorrect.';
    document.getElementById('inviteHelp').innerHTML = '<p><i class="fas fa-info-circle"></i> If you received this link from the couple, please ask them to verify their wedding is published and active.</p>';
    document.getElementById('inviteHelp').style.display = 'block';
    document.getElementById('actionButtons').innerHTML = '<a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Home</a>';
  }
})();
</script>
</body>
</html>
